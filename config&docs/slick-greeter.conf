# /etc/lightdm/slick-greeter.conf - login screen: your wallpaper, a clock, no clutter.
#
# The wallpaper itself is not set here. slick-greeter asks AccountsService for
# the user's desktop background and draws it when the lightdm user can read
# the file; see "Login screen" in readme.md for the one-line ACL that allows
# that. If it cannot, it falls back to the Mint default.
[Greeter]
draw-user-backgrounds=true
draw-grid=false
show-hostname=false
show-a11y=false
show-keyboard=false
show-clock=true
clock-format=%H:%M
